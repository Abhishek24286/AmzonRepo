<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="/styles folder/checkout.css">
  <link rel="stylesheet" href="/styles folder/order-symmary.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="checkout-header">
    <div class="header">
      <div class="left-header">
        <a href="/">
          <img class="amazon-logo-png" src="pictures/amazon-logo.png">
          <img class="amazon-mobile-logo" src="pictures/amazon-mobile-logo.png">
        </a>
      </div>
      <div class="middle-header">
        <div class="header-middle">
          <div class="checkout"> Checkout</div>
          <a class="back-to-home" href="/">
            <div class="items-count"></div>
          </a>
        </div>
      </div>
      <div class="right-section">
        <img class="checkout-lock-image" src="pictures/checkout-lock-icon.png">
      </div>
    </div>
  </div>
  <div class="main">
    <div class="order-review">
      <p class="review-class">Review your order</p>
    </div>
    <div class="content-grid">
      <div class="product-flex-container">
      </div>
      <div class="price-container">
        <div class="payment-info">
          <div class="order-symmary">Order Summary</div>
          <div class="js-items">
            <div class="js-items-1"></div>
            <div class="product-amount"></div>
          </div>
          <div class="shipping-handling">Shipping & handling:<div class="shippingAmount">
            </div>
          </div>
          <div class="totalAmount">Total before tax:<div class="totalAmounxtBeforetax"></div>
          </div>
          <div class="EstimatedTax">Estimated tax(10%):<div class="EstimatedTaxPrice"></div>
          </div>
        </div>
        <div class="finalTotal">
          <div class="order-total">Order-Total</div>
          <div class="total-amount"></div>
        </div>
        <div class="place-order">
          <button class="place-order-button"><a class="place-order-link" href="checkout/order">Place your
              order</a></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/script folder/checkout.js"></script>
</body>

</html>
