<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="/styles folder/order.css">
  <link rel="stylesheet" href="/styles folder/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="header">
    <div class="left-header">
      <img class="logo-png" src="/pictures/amazon-logo-white.png">
      <img class="logo-png2" src="/pictures/amazon-mobile-logo-white.png">
    </div>
    <div class="middle-header">
      <input class="search-bar" type="text" placeholder="Search">
      <button class="search-button">
        <img class="search-button-image" src="/pictures/search-icon.png">
      </button>
    </div>
    <div class="right-header">
      <img class="home-menu" src="/pictures/hamburger-menu.png">
      <div class="return-order">
        <span class="return">Returns</span>
        <span class="orders">& Orders</span>
      </div>
      <div class="amazon-cart-icon">
        <div class="cart-notification">0</div>
        <a href="/checkout"><img class="cart-icon-image" src="/pictures/cart-icon.png"></a>
        <div class="cart-menu">Cart</div>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="order-div">Your Orders</div>
    <div class="order-content-grid">
      <div class="content-header">
        <div class="left-section"></div>
        <div class="middle-section"></div>
        <div class="right-section"></div>
      </div>
    </div>
  </div>
  <script src="/script folder/order.js" type="module"></script>
</body>

</html>
